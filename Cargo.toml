[workspace]
members = ["core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
authors = ["peng.yi"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
tauri = { version = "3.0.0-alpha.3", features = [] }
tauri-build = { version = "3.0.0-alpha.2", features = [] }
tauri-runtime-wry = "3.0.0-alpha.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
json5 = "0.4"
toml_edit = "0.25"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
axum = "0.8"
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "http2"] }
eventsource-stream = "0.2"
bytes = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
serde_rusqlite = "0.43"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35"
uuid = { version = "1", features = ["v4"] }
arc-swap = "1.9.2"
secrecy = "0.10"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"
zstd = "0.13"
rand = "0.8"
zeroize = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs = "12"
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "wayland", "tokio"] }
wiremock = "0.6"
insta = "1"
tempfile = "3"
serial_test = "4"
pretty_assertions = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
