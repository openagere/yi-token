name: Build desktop packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    name: ${{ matrix.platform }} packages
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            bundles: msi,nsis
            apple-signing-identity: ""
            bundle-paths: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
          - platform: windows-arm64
            os: windows-11-vs2026-arm
            bundles: nsis
            apple-signing-identity: ""
            bundle-paths: target/release/bundle/nsis/*.exe
          - platform: macos-x64
            os: macos-15-intel
            bundles: dmg
            apple-signing-identity: "-"
            bundle-paths: target/release/bundle/dmg/*.dmg
          - platform: macos-arm64
            os: macos-15
            bundles: dmg
            apple-signing-identity: "-"
            bundle-paths: target/release/bundle/dmg/*.dmg
          - platform: linux-x64
            os: ubuntu-24.04
            bundles: deb,rpm,appimage
            apple-signing-identity: ""
            bundle-paths: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*.AppImage
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            bundles: deb,rpm
            apple-signing-identity: ""
            bundle-paths: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2t64 \
            xdg-utils \
            rpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.platform }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-cargo-

      - name: Build installers
        run: npx tauri build --bundles "${{ matrix.bundles }}"
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple-signing-identity }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: yi-token-${{ matrix.platform }}
          path: ${{ matrix.bundle-paths }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets-upload
          while IFS= read -r -d '' asset; do
            artifact="$(basename "$(dirname "$asset")")"
            filename="$(basename "$asset")"
            cp "$asset" "release-assets-upload/${artifact}-${filename}"
          done < <(find release-assets -type f -print0)

          mapfile -d '' -t assets < <(find release-assets-upload -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No installers were produced" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [ -z "$asset" ] || gh release delete-asset "$GITHUB_REF_NAME" "$asset" \
                --yes --repo "$GITHUB_REPOSITORY"
            done < <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "YiToken $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
